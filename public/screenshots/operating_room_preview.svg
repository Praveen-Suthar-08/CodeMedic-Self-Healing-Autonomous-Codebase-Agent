    <rect x="0" y="130" width="690" height="20" fill="#10B981" opacity="0.15"/>
    <text x="10" y="144" fill="#34D399">+   await updateLedger(event.data.object.id, amount);</text>

    <text x="10" y="168" fill="#8B949E">    return { status: 'processed', intentId: event.data.object.id };</text>
